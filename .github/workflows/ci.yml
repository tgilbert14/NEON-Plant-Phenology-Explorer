name: Validate Plant Phenology Explorer

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plant-phenology-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PHE_LIVE: "0"
  PHE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout the immutable app revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.PHE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the exact reviewed revision is checked out
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$PHE_SOURCE_SHA" ]]; then
            echo "Checked out $actual_sha; expected exact reviewed revision $PHE_SOURCE_SHA." >&2
            exit 1
          fi

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install runtime and verification dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            shiny, bslib@0.11.0, bsicons, dplyr, tidyr, stringr, tibble, plotly@4.12.0,
            leaflet, DT, shinyjs, shinycssloaders, RColorBrewer, htmltools,
            zip@3.0.1, jsonlite, rsconnect, cpp11,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: stable
          dependencies: '"hard"'
          cache-version: plant-phenology-geo-closure-v2
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify the deterministic OpenBLAS runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          lib.openblas_get_config.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          print(f"OpenBLAS core={core} threads={threads} config={lib.openblas_get_config().decode('ascii')}")
          if core.lower() != "haswell":
              raise SystemExit(f"expected OpenBLAS Haswell core, got {core!r}")
          if threads != 1:
              raise SystemExit(f"expected one OpenBLAS thread, got {threads}")
          PY

      - name: Parse source and verify static contracts
        run: |
          set -euo pipefail
          Rscript --vanilla -e 'for (f in c("global.R","ui.R","server.R",list.files("R", pattern="[.]R$", full.names=TRUE),list.files("scripts", pattern="[.]R$", full.names=TRUE))) parse(f)'
          node --check www/app.js
          node --check www/pincards.js
          node scripts/check_custom_message_handlers.mjs
          if [ -f scripts/check_cover.mjs ]; then node scripts/check_cover.mjs; fi
          if [ -f scripts/post_deploy_smoke.sh ]; then bash -n scripts/post_deploy_smoke.sh; fi

      - name: Run scientific helper contracts
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_bundle_identity.R
          Rscript --vanilla scripts/test_helpers.R

      - name: Normalize unavailable trend containers and require idempotence
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/normalize_empty_trends.R
          find data/sites data-sample -name '*.rds' -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/bundle-hashes-first.txt"
          Rscript --vanilla scripts/normalize_empty_trends.R
          find data/sites data-sample -name '*.rds' -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/bundle-hashes-second.txt"
          diff -u "$RUNNER_TEMP/bundle-hashes-first.txt" "$RUNNER_TEMP/bundle-hashes-second.txt"

      - name: Rebuild derived indexes twice and require identical bytes
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/rebuild_indexes.R
          find data -maxdepth 1 -name '*.rds' -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/index-hashes-first.txt"
          Rscript --vanilla scripts/rebuild_indexes.R
          find data -maxdepth 1 -name '*.rds' -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/index-hashes-second.txt"
          diff -u "$RUNNER_TEMP/index-hashes-first.txt" "$RUNNER_TEMP/index-hashes-second.txt"

      - name: Regenerate a pinned-runtime manifest candidate
        id: manifest
        run: Rscript --vanilla scripts/write_manifest.R

      - name: Verify bundles, indexes, and exact manifest
        run: Rscript --vanilla scripts/verify_bundle.R

      - name: Upload an unvalidated manifest for failed-gate diagnosis
        if: failure() && steps.manifest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-phenology-manifest-UNVALIDATED-${{ env.PHE_SOURCE_SHA }}
          path: manifest.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Source the complete app offline
        run: Rscript --vanilla -e 'Sys.setenv(PHE_LIVE="0"); source("global.R"); source("ui.R"); source("server.R"); stopifnot(inherits(ui, "shiny.tag.list") || inherits(ui, "shiny.tag"), is.function(server))'

      - name: Upload the validated manifest candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-phenology-manifest-${{ env.PHE_SOURCE_SHA }}
          path: manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload the validated derived-byte candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-phenology-release-candidate-${{ env.PHE_SOURCE_SHA }}
          path: |
            data/sites/KONA.rds
            data/site_index.rds
            data/national_onsets.rds
            data/search_index.rds
            manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Require committed release bytes to match the validator
        run: |
          git diff --exit-code -- manifest.json
          git diff --exit-code -- data data-sample
          git diff --check

name: Verify Phenology production after master publication

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: plant-phenology-production-health
  cancel-in-progress: true

jobs:
  semantic_health:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for Connect Cloud and verify semantic markers
        env:
          SMOKE_MAX_ATTEMPTS: "9"
          SMOKE_SLEEP_BASE: "20"
        run: |
          # The app's ddl-app-ready marker carries the first 12 hex of the
          # manifest md5 (global.R APP_BUILD), so the smoke passes only once the
          # live app serves THIS commit's manifest, not a stale build.
          build_id=$(md5sum manifest.json | cut -c1-12)
          export SMOKE_APP_MARKER="plant-phenology-v1 build-${build_id}"
          echo "Expecting marker: $SMOKE_APP_MARKER"
          sleep 45
          bash scripts/post_deploy_smoke.sh \
            "Connect Cloud app=https://019ee118-bf17-1622-bd5d-e59cab3b36a7.share.connect.posit.cloud/" \
            "GitHub Pages landing=https://tgilbert14.github.io/NEON-Plant-Phenology-Explorer/"

      - name: Open or update the production outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Plant Phenology semantic smoke failed"
          export ISSUE_TITLE="$title"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')
          body="Master publication ${GITHUB_SHA} did not pass semantic production health after the cold-start budget. Run: ${run_url}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a resolved production outage issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Production health: Plant Phenology semantic smoke failed"
          export ISSUE_TITLE="$title"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$number" --comment "Semantic production health recovered at ${GITHUB_SHA}. Evidence: ${run_url}"
          fi

      - name: Close the refresh-ready issue once its candidate is live
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # refresh-data.yml opens this issue when a validated review branch is
          # waiting; its body records "Candidate head: <sha>". Close it only when
          # that head is contained in the master commit that just passed the smoke.
          title="Phenology refresh ready for review"
          export ISSUE_TITLE="$title"
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')
          [ -n "$number" ] || exit 0
          head=$(gh issue view "$number" --json body,comments \
            --jq '[.body, (.comments[].body)] | map(capture("Candidate head: (?<s>[0-9a-f]{40})").s? // empty) | last // empty')
          [ -n "$head" ] || { echo "No candidate head recorded in issue #$number; leaving it open."; exit 0; }
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${head}...${GITHUB_SHA}" --jq .status 2>/dev/null || echo unknown)
          if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
            gh issue close "$number" --comment "Candidate ${head} is live in master ${GITHUB_SHA}, and the production smoke passed."
          else
            echo "Candidate ${head} is not in ${GITHUB_SHA} (compare status: ${status}); leaving issue #$number open."
          fi

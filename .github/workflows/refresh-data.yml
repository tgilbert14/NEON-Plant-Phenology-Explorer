name: Propose NEON plant-phenology refresh

# R 4.1.1 fetches into an empty raw staging area. A separate pinned R 4.5.2
# validator builds all 46 bundles, indexes, tests, manifest, and offline app. Only
# the final job can write, and it publishes a review branch—never master.

on:
  schedule:
    # Every Saturday 13:17 UTC == 06:17 America/Phoenix (no DST), clear of the
    # UTC-midnight edge. Cron cannot say "Nth Saturday of the month", so it fires
    # weekly and the gate job's shared calendar block picks the refresh week.
    - cron: "17 13 * * 6"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Skip NEON download; rebuild indexes/manifest from committed bundles"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plant-phenology-refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_WEEK: "1"
        run: |
          # Shared NEON-suite calendar gate. Keep this block byte-identical in every
          # repo; only the REFRESH_WEEK value above it differs. The cron fires every
          # Saturday 13:17 UTC (06:17 America/Phoenix, no DST). GitHub can start a
          # scheduled run hours late, so the gate judges the Saturday the run was
          # scheduled for, not the wall clock: it steps back to the most recent Phoenix
          # Saturday (today, on a Saturday) and proceeds only when that Saturday falls in
          # week REFRESH_WEEK of its month (week 1 = days 1-7, week 2 = days 8-14).
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Calendar gate: $EVENT_NAME run, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          started=$(TZ='America/Phoenix' date -d "@$now" '+%F %H:%M')
          dow=$(TZ='America/Phoenix' date -d "@$now" +%u)   # 1 = Monday ... 6 = Saturday, 7 = Sunday
          lag_days=$(( (dow + 1) % 7 ))                     # whole days since the most recent Saturday
          saturday_at=$(( now - lag_days * 86400 ))         # Phoenix has no DST, so a day is 86400 s
          saturday=$(TZ='America/Phoenix' date -d "@$saturday_at" +%F)
          saturday_week=$(( ($(TZ='America/Phoenix' date -d "@$saturday_at" +%-d) + 6) / 7 ))
          today_week=$(( ($(TZ='America/Phoenix' date -d "@$now" +%-d) + 6) / 7 ))
          if [ "$saturday_week" = "$REFRESH_WEEK" ]; then
            echo "Calendar gate: run for Saturday $saturday (week $saturday_week) started $started Phoenix, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPED_BY_CALENDAR: run for Saturday $saturday is week $saturday_week, not week $REFRESH_WEEK (started $started Phoenix)." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$today_week" = "$REFRESH_WEEK" ]; then
              echo "::warning title=Refresh skipped in its refresh week::Saturday $saturday is week $saturday_week, but this run started $started Phoenix, inside week $REFRESH_WEEK. Confirm the week-$REFRESH_WEEK Saturday run proceeds."
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe a NEON data endpoint with the token
        if: steps.check.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          PROBE_URL: https://data.neonscience.org/api/v0/data/DP1.10055.001/SRER/2023-12
        run: |
          # Shared NEON-suite token probe. Keep this block byte-identical in every repo;
          # only PROBE_URL differs. NEON data endpoints refuse anonymous requests, so a
          # missing or rejected token fails here, named, before any download starts.
          set -euo pipefail
          if [ -z "${NEON_TOKEN:-}" ]; then
            echo "::error title=Missing NEON token::Set the NEON_TOKEN repository secret; NEON data endpoints refuse anonymous requests."
            echo "NEON token probe: the NEON_TOKEN secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' \
            -H "X-API-Token: $NEON_TOKEN" "$PROBE_URL") || code=000
          files=$(jq -r '.data.files | length' "$body" 2>/dev/null) || files=0
          rm -f "$body"
          if [ "$code" != "200" ] || ! [ "$files" -ge 1 ] 2>/dev/null; then
            echo "::error title=NEON token rejected::HTTP $code with $files files from $PROBE_URL; check or rotate the NEON_TOKEN secret."
            echo "NEON token probe: HTTP $code, $files files from $PROBE_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "NEON token probe: HTTP 200, $files files from $PROBE_URL." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Watch the NEON release and issue log
        if: steps.check.outputs.run == 'true'
        shell: bash
        run: |
          # The fetch pins one NEON release (PHE_RELEASE in R/site_metadata.R).
          # Warn, never fail, when NEON publishes a newer release (RELEASE-2027 is
          # expected in late January) or logs product issues after the pinned
          # release was generated, so a person decides whether to re-pin.
          set -euo pipefail
          pinned=$(grep -oE 'tag = "RELEASE-[0-9]{4}"' R/site_metadata.R | grep -oE 'RELEASE-[0-9]{4}')
          body=$(mktemp)
          if ! curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" \
               https://data.neonscience.org/api/v0/products/DP1.10055.001; then
            echo "::warning title=NEON release watch::could not read the product API; the watch did not run."
            exit 0
          fi
          generated=$(jq -r --arg p "$pinned" '.data.releases[] | select(.release == $p) | .generationDate' "$body")
          newer=$(jq -r --arg p "$pinned" '[.data.releases[].release | select(. > $p)] | join(", ")' "$body")
          {
            echo "### NEON release watch"
            echo "- Pinned release: ${pinned} (generated ${generated:-unknown})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$newer" ]; then
            echo "::warning title=NEON release watch::${newer} is published; ${pinned} is still pinned. Re-pin PHE_RELEASE in R/site_metadata.R and run a full refresh."
            echo "- Newer release published: ${newer}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$generated" ]; then
            jq -r --arg g "$generated" '.data.changeLogs[] | select((.issueDate // "") > $g)
              | "\(.issueDate[0:10])\t\((.issue // "") | gsub("[\r\n]+"; " ") | .[0:200])"' "$body" |
            while IFS=$'\t' read -r day text; do
              echo "::warning title=NEON issue log ${day}::${text}"
              echo "- Issue log ${day}: ${text}" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          rm -f "$body"

  fetch_raw:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event.inputs.skip_download != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2024-12-31
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2024-12-31
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # neonUtilities::loadByProduct is isolated to the proven fetch runtime. The
      # deployed app and validator remain R 4.5.2 and never install neonUtilities.
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.1.1'
          use-public-rspm: false

      - name: Install fetch-only dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: neonUtilities@4.0.1, dplyr, tibble, tidyr, stringr, RColorBrewer
          pak-version: stable
          dependencies: '"hard"'
          cache-version: plant-phenology-fetch-r411-2024-12-31-v2
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Fetch all expected sites into empty staging
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          PHE_RAW_OUT_DIR: ${{ runner.temp }}/phe-raw
        run: |
          set -euo pipefail
          # The RSPM snapshot env does not pin a direct pak request, so assert
          # the exact fetch runtime before any download.
          Rscript --vanilla -e 'stopifnot(packageVersion("neonUtilities") == "4.0.1")'
          mkdir -p "$PHE_RAW_OUT_DIR"
          Rscript --vanilla scripts/fetch_all_phe.R
          count=$(find "$PHE_RAW_OUT_DIR" -maxdepth 1 -name '*_raw.rds' -type f | wc -l)
          test "$count" -eq 46

      - name: Upload immutable raw staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-phenology-raw-${{ github.sha }}
          path: ${{ runner.temp }}/phe-raw
          if-no-files-found: error
          retention-days: 7

  build_candidate:
    needs: [gate, fetch_raw]
    if: >-
      always() && needs.gate.outputs.run == 'true' &&
      (github.event.inputs.skip_download == 'true' || needs.fetch_raw.result == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PHE_LIVE: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false

      - name: Install pinned build and runtime closure
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            shiny, bslib@0.11.0, bsicons, dplyr, tidyr, stringr, tibble, plotly@4.12.0,
            leaflet, DT, shinyjs, shinycssloaders, RColorBrewer, htmltools,
            zip@3.0.1, jsonlite, rsconnect, cpp11,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: stable
          dependencies: '"hard"'
          cache-version: plant-phenology-refresh-geo-closure-v2
          install-pandoc: 'false'
          install-quarto: 'false'

      - name: Verify deterministic numeric runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          print(f"OpenBLAS core={core} threads={threads}")
          if core.lower() != "haswell" or threads != 1:
              raise SystemExit("numeric runtime contract failed")
          PY

      - name: Download raw staging
        if: ${{ github.event.inputs.skip_download != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plant-phenology-raw-${{ github.sha }}
          path: ${{ runner.temp }}/phe-raw

      - name: Build the complete 46-site candidate
        if: ${{ github.event.inputs.skip_download != 'true' }}
        env:
          PHE_RAW_DIR: ${{ runner.temp }}/phe-raw
        run: Rscript --vanilla scripts/bundle_phe_data.R

      - name: Rebuild indexes from committed bundles (fast path)
        if: ${{ github.event.inputs.skip_download == 'true' }}
        run: Rscript --vanilla scripts/rebuild_indexes.R

      - name: Regenerate and validate the exact release candidate
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/rebuild_indexes.R
          find data -maxdepth 1 -name '*.rds' -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/index-hashes-first.txt"
          Rscript --vanilla scripts/rebuild_indexes.R
          find data -maxdepth 1 -name '*.rds' -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/index-hashes-second.txt"
          diff -u "$RUNNER_TEMP/index-hashes-first.txt" "$RUNNER_TEMP/index-hashes-second.txt"
          Rscript --vanilla scripts/write_manifest.R
          Rscript --vanilla scripts/test_bundle_identity.R
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/verify_bundle.R
          node scripts/check_custom_message_handlers.mjs
          Rscript --vanilla -e 'Sys.setenv(PHE_LIVE="0"); source("global.R"); source("ui.R"); source("server.R"); stopifnot(inherits(ui, "shiny.tag.list") || inherits(ui, "shiny.tag"), is.function(server))'
          git diff --check

      - name: Package the validated candidate
        run: tar -czf "$RUNNER_TEMP/plant-phenology-refresh.tgz" data data-sample manifest.json

      - name: Upload immutable validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-phenology-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/plant-phenology-refresh.tgz
          if-no-files-found: error
          retention-days: 7

  publish_candidate:
    needs: [gate, build_candidate]
    if: needs.gate.outputs.run == 'true' && needs.build_candidate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plant-phenology-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/refresh-candidate

      - name: Publish review branch, never master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          remote_master=$(git rev-parse origin/master)
          if [ "$remote_master" != "$GITHUB_SHA" ]; then
            echo "::error title=Stale refresh base::master moved from $GITHUB_SHA to $remote_master; rebuild the candidate."
            exit 1
          fi
          find data data-sample -mindepth 1 -delete
          tar -xzf "$RUNNER_TEMP/refresh-candidate/plant-phenology-refresh.tgz"
          branch="automation/plant-phenology-data-refresh"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -A -- data data-sample manifest.json
          if git diff --cached --quiet -- data data-sample manifest.json; then
            echo "No validated candidate change, including untracked scoped files."
            exit 0
          fi
          git commit -m "data: propose validated plant-phenology refresh [bot]" \
                     -m "Produced from ${GITHUB_SHA}; 46 bundles, scientific contracts, indexes, exact manifest, and offline app source passed before publication."
          published_commit=$(git rev-parse HEAD)
          if [[ "$(git rev-parse HEAD^)" != "$GITHUB_SHA" ]]; then
            echo "Candidate promotion commit is not a direct child of the validated producer revision."
            exit 1
          fi
          if [[ -n "$remote_head" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_head" \
              origin "$branch:refs/heads/$branch"
          else
            git push origin "$branch:refs/heads/$branch"
          fi
          pushed_commit=""
          for _ in 1 2 3 4 5; do
            pushed_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [[ "$pushed_commit" == "$published_commit" ]] && break
            sleep 2
          done
          if [[ "$pushed_commit" != "$published_commit" ]]; then
            echo "Published branch does not resolve to the validated candidate commit."
            exit 1
          fi

          pr_count=$(gh pr list --head "$branch" --base master --state open \
            --json url --jq 'length')
          if (( pr_count > 1 )); then
            echo "More than one open master PR exists for $branch; refusing ambiguous publication."
            exit 1
          fi
          if (( pr_count == 0 )); then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${branch}?expand=1"
            {
              echo "### Validated Plant Phenology review branch ready"
              echo "- Branch: ${branch}"
              echo "- Exact head: ${published_commit}"
              echo "- Validator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- [Open the reviewer-authenticated PR](${compare_url})"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Validated review branch ready::Open a reviewer-authenticated PR from $branch to master after reviewing run ${GITHUB_RUN_ID}; that PR event is the exact-head CI trigger."
            # A green run with a notice is easy to miss: keep one open issue as
            # the signal (exact-title match, never a fuzzy --search). post-deploy.yml
            # closes it once the recorded candidate head is live in master.
            export ISSUE_TITLE="Phenology refresh ready for review"
            issue_body=$(printf '%s\n\n%s\n%s\n%s\n' \
              "A validated Plant Phenology refresh is waiting on branch ${branch}." \
              "Candidate head: ${published_commit}" \
              "Validator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "Open the PR: ${compare_url}")
            number=$(gh issue list --state open --limit 200 --json number,title \
              --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$issue_body"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$issue_body"
            fi
            exit 0
          fi

          pr_record=""
          for _ in 1 2 3 4 5; do
            pr_record=$(gh pr list --head "$branch" --base master --state open \
              --json url,baseRefName,headRefName,headRefOid \
              --jq 'if length == 1 then .[0] | [.url,.baseRefName,.headRefName,.headRefOid] | @tsv else "" end')
            [[ "$pr_record" == *$'\t'"$published_commit" ]] && break
            sleep 2
          done
          IFS=$'\t' read -r pr_url pr_base pr_head pr_oid <<< "$pr_record"
          if [[ -z "$pr_record" || "$pr_base" != master || "$pr_head" != "$branch" || \
                "$pr_oid" != "$published_commit" ]]; then
            echo "Open PR identity does not match master <- $branch at $published_commit."
            exit 1
          fi
          gh pr comment "$pr_url" \
            --body "Updated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. GitHub will hold the pull_request synchronize checks triggered by this automation update for approval; a repository write user must select **Approve workflows to run**. Do not merge until checks are green on exact head ${published_commit}."
          echo "::notice title=Approve exact-head PR checks::Existing PR updated to $published_commit. A repository write user must select Approve workflows to run, then verify green checks on that exact head."

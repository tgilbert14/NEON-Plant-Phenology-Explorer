<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phenology social-card renderer</title>
  <style>
    *{box-sizing:border-box} html,body{width:1200px;height:630px;margin:0;overflow:hidden;background:#071d1b}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background-image:linear-gradient(90deg,rgba(5,25,23,.99) 0%,rgba(6,29,27,.91) 48%,rgba(5,21,20,.12) 82%),url("phenology-seasonal-hero-v1-source.png");background-position:center;background-size:cover}
    main{width:1200px;height:630px;padding:54px 64px;position:relative}
    .eyebrow{display:inline-block;padding:7px 18px;border:1px solid rgba(123,216,142,.5);border-radius:999px;background:#123f36;color:#d5ffe0;font-size:15px;font-weight:800;letter-spacing:1.6px}
    h1{font:700 66px/.98 Georgia,Cambria,serif;letter-spacing:-1.2px;margin:48px 0 20px;width:600px}
    .season{width:500px;height:6px;border-radius:3px;background:linear-gradient(90deg,#b9df73,#e97677,#e38b2a)}
    .lead{margin:28px 0 0;width:565px;color:#d7e8df;font-size:26px;line-height:1.48;font-weight:520}
    .chips{display:flex;gap:16px;margin-top:54px}.chip{height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:850}
    .sites{width:154px;background:#f0a24a;color:#10251f}.truth{width:278px;background:#123f36;border:1px solid rgba(140,207,117,.65)}
    footer{position:absolute;left:64px;bottom:43px;color:#a8c8b8;font-size:17px;font-weight:700;letter-spacing:.2px}
  </style>
</head>
<body><main>
  <div class="eyebrow">NEON EXPLORER SUITE · PLANT TIMING</div>
  <h1>Plant Phenology<br>Explorer</h1>
  <div class="season"></div>
  <p class="lead">See when tagged plants leaf out, bloom,<br>carry leaves, and turn—with support visible.</p>
  <div class="chips"><div class="chip sites">46 SITES</div><div class="chip truth">TIMING, NOT ABUNDANCE</div></div>
  <footer>DESERT DATA LABS · NEON DP1.10055.001</footer>
</main></body>
</html>
